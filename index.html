<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-title" content="Checkers">
    <meta name="theme-color" content="#3d2414">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Chinese Checkers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Shared gradients for the board. Lives outside #game-board because render() clears that SVG. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
        <defs>
            <!-- Glass marble: specular highlight top-left, darker toward the edge -->
            <radialGradient id="marble-shine" cx="50%" cy="50%" r="50%" fx="34%" fy="28%">
                <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
                <stop offset="18%" stop-color="#fff" stop-opacity="0.35"/>
                <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
                <stop offset="80%" stop-color="#000" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
            </radialGradient>
            <!-- Drilled hole lit from above: shadowed top wall, lit bottom wall -->
            <linearGradient id="hole-shade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#140a04"/>
                <stop offset="55%" stop-color="#2e1b0e"/>
                <stop offset="100%" stop-color="#8a6038"/>
            </linearGradient>
        </defs>
    </svg>

    <div class="container">
        <h1>Chinese Checkers</h1>
        <!-- Notification Container -->
        <div class="notification-container" id="notification-container"></div>

        <!-- Game State Overlay -->
        <div class="game-state-overlay" id="game-state-overlay">
            <div class="game-state-content">
                <div class="winner-text" id="winner-text">🎉 Congratulations! 🎉</div>
                <div class="winner-subtitle" id="winner-subtitle">You are the Chinese Checkers Champion!</div>
                <button class="setup-btn interactive-element" onclick="document.getElementById('restart-btn').click()">
                    Play Again
                </button>
            </div>
        </div>

        <div id="setup-screen">
            <div id="player-count-selection">
                <h2>Select Number of Players</h2>
                <div id="player-selection">
                    <button class="setup-btn interactive-element" data-players="2">2 Players</button>
                    <button class="setup-btn interactive-element" data-players="3">3 Players</button>
                    <button class="setup-btn interactive-element" data-players="4">4 Players</button>
                    <button class="setup-btn interactive-element" data-players="6">6 Players</button>
                </div>
            </div>
            <div id="color-selection-container" style="display: none;">
                <h2>Player Setup</h2>
                <div id="player-setup-info">
                    <h3 id="current-player-title">Player 1 Setup</h3>
                </div>
                
                <!-- Player Type & Difficulty on same line -->
                <div id="player-config-row">
                    <!-- Player Type Selection -->
                    <div id="player-type-selection">
                        <h4>Player Type</h4>
                        <div class="player-type-buttons">
                            <button class="player-type-btn selected" data-type="human">Human</button>
                            <button class="player-type-btn" data-type="ai">AI</button>
                        </div>
                    </div>
                    
                    <!-- AI Difficulty Selection (shown only when AI is selected) -->
                    <div id="ai-difficulty-selection" style="display: none;">
                        <h4>AI Difficulty</h4>
                        <div class="difficulty-buttons">
                            <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                            <button class="difficulty-btn selected" data-difficulty="medium">Medium</button>
                            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                        </div>
                    </div>
                </div>
                
                <!-- Colors in a single compact row -->
                <div id="color-swatches">
                    <!-- Color swatches are generated here by JavaScript -->
                </div>
                
                <div id="color-selection-controls">
                    <button id="back-to-players-btn" class="setup-btn interactive-element">Back</button>
                    <button id="start-game-btn" class="setup-btn interactive-element" disabled>Start Game</button>
                </div>
            </div>
        </div>

        <div id="game-screen">
            
            <div id="game-info">
                <div id="status-area">
                    <div id="turn-indicator"></div>
                    <div id="status-text"></div>
                </div>
                <div id="controls">
                    <button id="end-turn-btn" class="game-button interactive-element">End Turn</button>
                    <button id="restart-btn" class="game-button interactive-element">New Game</button>
                    <label><input type="checkbox" id="toggle-valid-moves" checked> Show Valid Moves</label>
                </div>
            </div>
            <div id="game-board-container">
                <!-- viewBox is centered on (0,0); size is set in CSS via --board-size -->
                <svg id="game-board" viewBox="-265 -265 530 530"></svg>
            </div>
        </div>
    </div>

    <script type="module" src="ai-player.js"></script>
    <script type="module" src="script.js"></script>
    <!-- Simple Analytics - 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
